name: ESP-IDF CI Test

on:
  push:
    branches: [ main ]
    paths:
      - 'firmware/stanag-s3-simulator/**'

jobs:
  test-runner:
    name: Test Runner
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test basic command
        run: echo "Runner works!" && uname -a && docker --version

  build:
    name: Build (ESP32-S3)
    runs-on: ubuntu-22.04
    needs: test-runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup ESP-IDF
        uses: espressif/esp-idf-ci-action@v1.2
        with:
          esp_idf_version: v5.5.6
          install_tools: true
          install_python_packages: true
          cache_ccache: true
          cache_idf: true

      - name: Configure project
        working-directory: ./firmware/stanag-s3-simulator
        run: |
          idf.py set-target esp32s3
          idf.py reconfigure

      - name: Build project
        working-directory: ./firmware/stanag-s3-simulator
        run: |
          idf.py build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: |
            firmware/stanag-s3-simulator/build/*.bin
            firmware/stanag-s3-simulator/build/*.elf
            firmware/stanag-s3-simulator/build/*.map
            firmware/stanag-s3-simulator/build/partition_table/*.bin
            firmware/stanag-s3-simulator/build/bootloader/*.bin
          retention-days: 30