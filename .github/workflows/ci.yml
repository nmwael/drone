name: ESP-IDF CI

on:
  push:
    branches: [ main ]
    paths:
      - 'firmware/stanag-s3-simulator/**'
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
    paths:
      - 'firmware/stanag-s3-simulator/**'

env:
  IDF_VERSION: v5.5.6

jobs:
  build:
    name: Build (ESP32-S3)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ESP-IDF
        uses: espressif/install-esp-idf-action@v1
        with:
          version: ${{ env.IDF_VERSION }}
          path: /opt/esp/idf
          tools-path: /opt/esp/tools

      - name: Configure project
        working-directory: ./firmware/stanag-s3-simulator
        run: |
          /opt/esp/idf/install.sh esp32s3
          . /opt/esp/idf/export.sh
          idf.py set-target esp32s3
          idf.py reconfigure

      - name: Build project
        working-directory: ./firmware/stanag-s3-simulator
        run: |
          . /opt/esp/idf/export.sh
          idf.py build

      - name: Check binary size
        working-directory: ./firmware/stanag-s3-simulator
        run: |
          . /opt/esp/idf/export.sh
          idf.py size
          idf.py size-components
          idf.py size-files

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: |
            firmware/stanag-s3-simulator/build/*.bin
            firmware/stanag-s3-simulator/build/*.elf
            firmware/stanag-s3-simulator/build/*.map
            firmware/stanag-s3-simulator/build/partition_table/*.bin
            firmware/stanag-s3-simulator/build/bootloader/*.bin
          retention-days: 30

  static_analysis:
    name: Static Analysis
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ESP-IDF
        uses: espressif/install-esp-idf-action@v1
        with:
          version: ${{ env.IDF_VERSION }}
          path: /opt/esp/idf
          tools-path: /opt/esp/tools

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        working-directory: ./firmware/stanag-s3-simulator
        run: |
          . /opt/esp/idf/export.sh
          cppcheck --enable=warning,style,performance,portability \
            --std=c99 \
            --platform=esp32 \
            --suppress=missingIncludeSystem \
            -I main \
            -I /opt/esp/idf/components/freertos/include \
            -I /opt/esp/idf/components/esp_system/include \
            -I /opt/esp/idf/components/log/include \
            -I /opt/esp/idf/components/esp_timer/include \
            -I /opt/esp/idf/components/esp_psram/include \
            main/*.c \
            2>&1 | tee cppcheck.log || true

  release:
    name: Create Release
    runs-on: ubuntu-22.04
    needs: [build, static_analysis]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-esp32s3
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/stanag-s3-simulator.bin
            ./artifacts/bootloader.bin
            ./artifacts/partition-table.bin
            ./artifacts/stanag-s3-simulator.elf
            ./artifacts/stanag-s3-simulator.map
          generate_release_notes: true
          draft: false
          prerelease: false