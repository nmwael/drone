name: ESP-IDF CI

on:
  push:
    branches: [ main ]
    paths:
      - 'firmware/stanag-s3-simulator/**'
    tags:
      - 'v*'

env:
  IDF_VERSION: v5.5.6

jobs:
  build:
    name: Build (ESP32-S3)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build with ESP-IDF Docker
        uses: docker://espressif/idf:${{ env.IDF_VERSION }}
        with:
          entrypoint: ''
          args: bash -c "cd /github/workspace/firmware/stanag-s3-simulator && idf.py set-target esp32s3 && idf.py reconfigure && idf.py build"

      - name: Check binary size
        uses: docker://espressif/idf:${{ env.IDF_VERSION }}
        with:
          entrypoint: ''
          args: bash -c "cd /github/workspace/firmware/stanag-s3-simulator && idf.py size && idf.py size-components && idf.py size-files"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: |
            firmware/stanag-s3-simulator/build/*.bin
            firmware/stanag-s3-simulator/build/*.elf
            firmware/stanag-s3-simulator/build/*.map
            firmware/stanag-s3-simulator/build/partition_table/*.bin
            firmware/stanag-s3-simulator/build/bootloader/*.bin
          retention-days: 30

  static_analysis:
    name: Static Analysis
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run cppcheck
        uses: docker://espressif/idf:${{ env.IDF_VERSION }}
        with:
          entrypoint: ''
          args: bash -c "apt-get update && apt-get install -y cppcheck && cd /github/workspace/firmware/stanag-s3-simulator && cppcheck --enable=warning,style,performance,portability --std=c99 --platform=esp32 --suppress=missingIncludeSystem -I main -I /opt/esp/idf/components/freertos/include -I /opt/esp/idf/components/esp_system/include -I /opt/esp/idf/components/log/include -I /opt/esp/idf/components/esp_timer/include -I /opt/esp/idf/components/esp_psram/include main/*.c 2>&1 | tee cppcheck.log || true"

  release:
    name: Create Release
    runs-on: ubuntu-22.04
    needs: [build, static_analysis]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-esp32s3
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/stanag-s3-simulator.bin
            ./artifacts/bootloader.bin
            ./artifacts/partition-table.bin
            ./artifacts/stanag-s3-simulator.elf
            ./artifacts/stanag-s3-simulator.map
          generate_release_notes: true
          draft: false
          prerelease: false