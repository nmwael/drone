name: ESP-IDF CI

on:
  push:
    branches: [ main ]
    paths:
      - 'firmware/stanag-s3-simulator/**'
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
    paths:
      - 'firmware/stanag-s3-simulator/**'

env:
  IDF_VERSION: v5.5.6

jobs:
  build:
    name: Build (ESP32-S3)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Build with ESP-IDF Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/firmware/stanag-s3-simulator \
            espressif/idf:${{ env.IDF_VERSION }} \
            sh -c "idf.py set-target esp32s3 && idf.py reconfigure && idf.py build && idf.py size && idf.py size-components && idf.py size-files"

      - name: List build output
        run: |
          ls -la firmware/stanag-s3-simulator/build/
          ls -la firmware/stanag-s3-simulator/build/*.bin 2>/dev/null || echo "No .bin files found"
          ls -la firmware/stanag-s3-simulator/build/*.elf 2>/dev/null || echo "No .elf files found"
          ls -la firmware/stanag-s3-simulator/build/*.map 2>/dev/null || echo "No .map files found"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: firmware-esp32s3
          path: |
            firmware/stanag-s3-simulator/build/*.bin
            firmware/stanag-s3-simulator/build/*.elf
            firmware/stanag-s3-simulator/build/*.map
            firmware/stanag-s3-simulator/build/partition_table/*.bin
            firmware/stanag-s3-simulator/build/bootloader/*.bin
          retention-days: 30

  static_analysis:
    name: Static Analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Run cppcheck
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/firmware/stanag-s3-simulator \
            espressif/idf:${{ env.IDF_VERSION }} \
            bash -c "apt-get update && apt-get install -y cppcheck && cppcheck --enable=warning,style,performance,portability --std=c99 --platform=esp32 --suppress=missingIncludeSystem -I main -I /opt/esp/idf/components/freertos/include -I /opt/esp/idf/components/esp_system/include -I /opt/esp/idf/components/log/include -I /opt/esp/idf/components/esp_timer/include -I /opt/esp/idf/components/esp_psram/include main/*.c 2>&1 | tee cppcheck.log || true"

  release:
    name: Create Release
    runs-on: ubuntu-24.04
    needs: [build, static_analysis]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: firmware-esp32s3
          path: ./artifacts

      - name: List downloaded artifacts
        run: |
          ls -la ./artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          files: |
            ./artifacts/stanag-s3-simulator.bin
            ./artifacts/bootloader.bin
            ./artifacts/partition-table.bin
            ./artifacts/stanag-s3-simulator.elf
            ./artifacts/stanag-s3-simulator.map
          generate_release_notes: true
          draft: false
          prerelease: false