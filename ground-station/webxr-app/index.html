<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="RC Monster Truck WebXR Teleop - STANAG 4609 Video">
    <title>RC Truck Teleop - WebXR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
        }
        #video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0;
            pointer-events: none;
        }
        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .btn {
            position: absolute;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            pointer-events: auto;
        }
        .btn-primary {
            background: #0066ff;
            color: white;
        }
        .btn-primary:hover {
            background: #0052cc;
            transform: scale(1.02);
        }
        .btn:active {
            transform: scale(0.98);
        }
        #enter-xr {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            min-width: 280px;
        }
        #enter-xr.hidden {
            display: none;
        }
        .status-bar {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-family: monospace;
            pointer-events: auto;
        }
        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #666;
        }
        .status-dot.connected { background: #00ff88; }
        .status-dot.connecting { background: #ffaa00; animation: pulse 1s infinite; }
        .status-dot.error { background: #ff3333; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .telemetry-grid {
            position: absolute;
            top: 20px;
            right: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 8px;
            pointer-events: auto;
        }
        .telemetry-card {
            background: rgba(0, 0, 0, 0.7);
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-family: monospace;
            font-size: 12px;
        }
        .telemetry-label {
            color: #888;
            font-size: 10px;
            text-transform: uppercase;
        }
        .telemetry-value {
            font-size: 16px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- Video element (hidden, used as texture source) -->
    <video id="video" autoplay muted playsinline></video>

    <!-- Three.js canvas for WebXR rendering -->
    <canvas id="canvas"></canvas>

    <!-- UI Overlay -->
    <div id="ui-overlay">
        <!-- Enter XR Button -->
        <button id="enter-xr" class="btn btn-primary">
            🥽 Enter VR Teleop
        </button>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-item">
                <span class="status-dot" id="status-video"></span>
                <span>Video</span>
            </div>
            <div class="status-item">
                <span class="status-dot" id="status-telemetry"></span>
                <span>Telemetry</span>
            </div>
            <div class="status-item">
                <span class="status-dot" id="status-control"></span>
                <span>Control</span>
            </div>
            <div class="status-item">
                <span class="status-dot" id="status-xr"></span>
                <span>XR Session</span>
            </div>
        </div>

        <!-- Telemetry Cards -->
        <div class="telemetry-grid" id="telemetry-grid">
            <div class="telemetry-card">
                <div class="telemetry-label">Lat / Lon</div>
                <div class="telemetry-value" id="tel-gps">--</div>
            </div>
            <div class="telemetry-card">
                <div class="telemetry-label">Altitude</div>
                <div class="telemetry-value" id="tel-alt">--</div>
            </div>
            <div class="telemetry-card">
                <div class="telemetry-label">Heading</div>
                <div class="telemetry-value" id="tel-hdg">--</div>
            </div>
            <div class="telemetry-card">
                <div class="telemetry-label">Speed</div>
                <div class="telemetry-value" id="tel-spd">--</div>
            </div>
            <div class="telemetry-card">
                <div class="telemetry-label">Temp / RH</div>
                <div class="telemetry-value" id="tel-temp">--</div>
            </div>
            <div class="telemetry-card">
                <div class="telemetry-label">Pressure</div>
                <div class="telemetry-value" id="tel-pres">--</div>
            </div>
            <div class="telemetry-card">
                <div class="telemetry-label">Mode</div>
                <div class="telemetry-value" id="tel-mode">--</div>
            </div>
            <div class="telemetry-card">
                <div class="telemetry-label">Latency</div>
                <div class="telemetry-value" id="tel-lat">--</div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
