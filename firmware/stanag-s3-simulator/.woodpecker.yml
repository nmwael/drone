# Woodpecker CI Configuration for Codeberg
# Woodpecker is the CI system used by Codeberg (compatible with Drone CI syntax)

version: "1"

pipeline:
  build:
    image: espressif/idf:v5.5
    commands:
      - cd firmware/stanag-s3-simulator
      - idf.py set-target esp32s3
      - idf.py build
    when:
      event: [push, pull_request, tag]
    volumes:
      - /tmp/ccache:/root/.cache/ccache

  qemu_test:
    image: espressif/idf:v5.5
    commands:
      - cd firmware/stanag-s3-simulator
      - timeout 60 idf.py -p /dev/null qemu monitor 2>&1 | tee qemu_output.log || true
      - python3 scripts/parse_ts_output.py qemu_output.log || true
    when:
      event: [push, pull_request, tag]
    depends_on:
      - build

  unit_tests:
    image: espressif/idf:v5.5
    commands:
      - cd firmware/stanag-s3-simulator
      - timeout 120 idf.py -p /dev/null qemu monitor 2>&1 | tee test_output.log || true
      - |
        if grep -q "Tests passed" test_output.log; then
          echo "✅ Unit tests passed"
        elif grep -q "Tests failed" test_output.log; then
          echo "❌ Unit tests failed"
          exit 1
        else
          echo "⚠️ Test output unclear"
          cat test_output.log
        fi
    when:
      event: [push, pull_request, tag]
    depends_on:
      - build

  static_analysis:
    image: espressif/idf:v5.5
    commands:
      - cd firmware/stanag-s3-simulator
      - idf.py reconfigure
      - |
        cppcheck --enable=warning,style,performance,portability \
          --std=c99 \
          --platform=esp32 \
          --suppress=missingIncludeSystem \
          -I main \
          -I /opt/esp/idf/components/freertos/include \
          -I /opt/esp/idf/components/esp_system/include \
          -I /opt/esp/idf/components/log/include \
          -I /opt/esp/idf/components/esp_timer/include \
          -I /opt/esp/idf/components/esp_psram/include \
          main/*.c \
          2>&1 | tee cppcheck.log || true
    when:
      event: [push, pull_request, tag]
    depends_on:
      - build

  validate_ts:
    image: espressif/idf:v5.5
    commands:
      - apt-get update && apt-get install -y ffmpeg
      - cd firmware/stanag-s3-simulator
      - timeout 60 idf.py -p /dev/null qemu monitor 2>&1 | tee qemu_output.log || true
      - python3 scripts/parse_ts_output.py qemu_output.log || true
    when:
      event: [push, pull_request, tag]
    depends_on:
      - qemu_test

  size_report:
    image: espressif/idf:v5.5
    commands:
      - cd firmware/stanag-s3-simulator
      - idf.py size
      - idf.py size-components
      - idf.py size-files
    when:
      event: [push, pull_request, tag]
    depends_on:
      - build

  # Upload build artifacts (bin, elf, map) to Woodpecker
  upload_artifacts:
    image: plugins/artifact:latest
    settings:
      path:
        - firmware/stanag-s3-simulator/build/*.bin
        - firmware/stanag-s3-simulator/build/*.elf
        - firmware/stanag-s3-simulator/build/*.map
        - firmware/stanag-s3-simulator/build/partition_table/*.bin
        - firmware/stanag-s3-simulator/build/bootloader/*.bin
      destination: /artifacts/${DRONE_REPO}/${DRONE_BUILD_NUMBER}
    when:
      event: [push, tag]
      status: [success]
    depends_on:
      - build

  # Create release on tag push (requires Codeberg API token in secrets)
  create_release:
    image: plugins/gitea-release:latest
    settings:
      api_key:
        from_secret: codeberg_token
      base_url: https://codeberg.org/api/v1
      files:
        - firmware/stanag-s3-simulator/build/stanag-s3-simulator.bin
        - firmware/stanag-s3-simulator/build/bootloader/bootloader.bin
        - firmware/stanag-s3-simulator/build/partition_table/partition-table.bin
        - firmware/stanag-s3-simulator/build/stanag-s3-simulator.elf
        - firmware/stanag-s3-simulator/build/stanag-s3-simulator.map
      title: "STANAG S3 Simulator v${DRONE_TAG}"
      note: |
        ## STANAG S3 Simulator - ESP32-S3 Firmware
        
        Built from commit: ${DRONE_COMMIT_SHA}
        
        ### Artifacts
        - `stanag-s3-simulator.bin` - Main application binary
        - `bootloader.bin` - Bootloader
        - `partition-table.bin` - Partition table
        - `stanag-s3-simulator.elf` - ELF with symbols (for debugging)
        - `stanag-s3-simulator.map` - Linker map file
        
        ### Flashing
        ```bash
        esptool.py --chip esp32s3 -b 460800 write_flash \
          0x0 bootloader.bin \
          0x8000 partition-table.bin \
          0x10000 stanag-s3-simulator.bin
        ```
    when:
      event: [tag]
      status: [success]
    depends_on:
      - build
      - upload_artifacts